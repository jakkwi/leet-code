[project]
name = "leetcode-cpp-python"
version = "0.1.0"
description = "LeetCode solutions in C++20 and Python with shared test cases"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    "mypy>=1.18",
    "pip-audit>=2.9",
    # Same major version as the LLVM bundled with Visual Studio 2022, so local
    # formatting matches CI byte for byte.
    "clang-format==19.1.*",
    "clang-tidy==19.1.*",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["problems", "common/python/tests", "tools/tests"]
pythonpath = ["common/python"]
# Every problem has its own solution.py, so modules must not share sys.path.
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["common/python"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PT", "PL", "PERF", "S",
]
ignore = [
    "PLR2004", # magic values are normal in algorithm code
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101"] # assert is how pytest works
"tools/**" = ["S603", "S607"] # tools run fixed git/python commands
".claude/hooks/**" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "common/python"
warn_unreachable = true

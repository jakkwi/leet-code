# C++ dependencies (cmake/Dependencies.cmake) are pinned by commit + SHA-256
# and bumped by hand: Dependabot does not understand FetchContent.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }

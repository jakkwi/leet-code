name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (pytest, ruff, mypy, isolation)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python tools/run_mypy.py
      - run: uv run python tools/check_isolation.py
      - run: uv run pytest

  cpp-linux:
    name: C++ Linux Clang (ASan + UBSan, clang-tidy)
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: uv sync --locked
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: ctest --preset debug
      - run: uv run python tools/lint_cpp.py --tidy build/debug

  cpp-windows:
    name: C++ Windows MSVC (ASan)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: ctest --preset debug
